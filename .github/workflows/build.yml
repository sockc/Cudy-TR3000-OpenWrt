name: Build TR3000 U-Boot Mod

on:
  workflow_dispatch:
    inputs:
      with_luci:
        description: "Include LuCI web admin (HTTPS)"
        type: boolean
        required: true
        default: true
      with_smartdns:
        description: "Include SmartDNS and LuCI SmartDNS app"
        type: boolean
        required: true
        default: true
      with_tailscale:
        description: "Include Tailscale"
        type: boolean
        required: true
        default: true
      custom_packages:
        description: "Extra official package names (space or comma separated)"
        type: string
        required: false
        default: ""
      publish_release:
        description: Publish firmware in Releases
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: tr3000-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      DEVICE: cudy_tr3000-v1-ubootmod
      OPENWRT_REF: v24.10.6
      WITH_LUCI: ${{ inputs.with_luci }}
      WITH_SMARTDNS: ${{ inputs.with_smartdns }}
      WITH_TAILSCALE: ${{ inputs.with_tailscale }}
      CUSTOM_PACKAGES: ${{ inputs.custom_packages }}
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h .

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl subversion time zip xz-utils libelf-dev libzstd-dev

      - name: Clone pinned OpenWrt source
        run: git clone --depth 1 --branch "$OPENWRT_REF" https://github.com/openwrt/openwrt.git openwrt

      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target and packages
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          grep -Fqx "TARGET_DEVICES += ${DEVICE}" target/linux/mediatek/image/filogic.mk
          cat > .config <<CFG
          CONFIG_TARGET_mediatek=y
          CONFIG_CLEAN_IPKG=n
          CONFIG_USE_APK=n
          CONFIG_SIGNED_PACKAGES=y
          CONFIG_SIGNATURE_CHECK=y
          CONFIG_DOWNLOAD_CHECK_CERTIFICATE=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y
          CFG
          packages=()
          # Read common packages and selected optional groups from one list.
          selected_file="$(mktemp)"
          cat ../packages.txt > "$selected_file"
          # Additional packages are only allowed from the already-installed official feeds.
          # Never evaluate the user input as a command or configuration directive.
          custom_normalized="${CUSTOM_PACKAGES//,/ }"
          read -r -a extras <<< "$custom_normalized" || true
          if (( ${#extras[@]} > 40 )); then
            echo "::error::Maximum 40 extra packages"; exit 1
          fi
          for pkg in "${extras[@]}"; do
            [[ "$pkg" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.+-]*$ ]] || {
              echo "::error::Invalid package name: $pkg"; exit 1;
            }
            printf '%s\n' "$pkg" >> "$selected_file"
          done
          if [[ "$WITH_LUCI" == "true" ]]; then
            printf '%s\n' luci luci-ssl luci-app-firewall luci-i18n-base-zh-cn >> "$selected_file"
          fi
          if [[ "$WITH_SMARTDNS" == "true" ]]; then
            printf '%s\n' smartdns luci-app-smartdns luci-i18n-smartdns-zh-cn >> "$selected_file"
          fi
          if [[ "$WITH_TAILSCALE" == "true" ]]; then
            printf '%s\n' tailscale >> "$selected_file"
          fi
          # SmartDNS LuCI management needs LuCI, even when the LuCI checkbox is off.
          if [[ "$WITH_SMARTDNS" == "true" && "$WITH_LUCI" != "true" ]]; then
            echo "SmartDNS includes its LuCI application; enabling LuCI dependency automatically."
          fi
          sort -u "$selected_file" > ../selected-packages.txt
          while IFS= read -r pkg || [[ -n "$pkg" ]]; do
            pkg="${pkg%%#*}"
            pkg="${pkg//[[:space:]]/}"
            [[ -z "$pkg" ]] && continue
            [[ "$pkg" =~ ^[a-zA-Z0-9_.+-]+$ ]] || { echo "Invalid package name: $pkg"; exit 1; }
            packages+=("$pkg")
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done < ../selected-packages.txt
          make defconfig
          check_config() {
            local expected="$1" label="$2"
            if ! grep -Fxq -- "$expected" .config; then
              echo "::error::Configuration validation failed: $label (expected: $expected)"
              grep -E '^(CONFIG_TARGET|# CONFIG_TARGET|CONFIG_PACKAGE_|# CONFIG_PACKAGE_|CONFIG_CLEAN_IPKG|# CONFIG_CLEAN_IPKG|CONFIG_USE_APK|# CONFIG_USE_APK|CONFIG_SIGNATURE_CHECK|# CONFIG_SIGNATURE_CHECK|CONFIG_DOWNLOAD_CHECK_CERTIFICATE|# CONFIG_DOWNLOAD_CHECK_CERTIFICATE)' .config | grep -E '(TARGET_mediatek|TARGET_DEVICE_|PACKAGE_(luci|smartdns|tailscale|nano|htop|curl|tcpdump)|CLEAN_IPKG|USE_APK|SIGNATURE_CHECK|DOWNLOAD_CHECK_CERTIFICATE)' || true
              exit 1
            fi
          }
          check_config "CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y" "TR3000 U-Boot Mod profile"
          for pkg in "${packages[@]}"; do
            check_config "CONFIG_PACKAGE_${pkg}=y" "package ${pkg}"
          done
          # OpenWrt Kconfig may omit disabled options or render '# ... is not set'.
          if grep -Eq '^CONFIG_CLEAN_IPKG=y$|^CONFIG_USE_APK=y$' .config; then
            echo "::error::OpenWrt opkg feed mode unexpectedly disabled"
            exit 1
          fi
          check_config "CONFIG_SIGNATURE_CHECK=y" "opkg signature verification"
          check_config "CONFIG_DOWNLOAD_CHECK_CERTIFICATE=y" "TLS download certificate checks"
          cp .config ../effective.config
          cp ../selected-packages.txt ../requested-packages.txt
          if [[ "$WITH_LUCI" == "true" ]]; then
            # LuCI i18n is installed above; configure Chinese as the default UI language.
            mkdir -p files/etc/uci-defaults
            cat > files/etc/uci-defaults/99-luci-zh-cn <<'SCRIPT'
          #!/bin/sh
          uci -q set luci.main.lang='zh_cn'
          uci -q commit luci
          exit 0
          SCRIPT
            chmod 755 files/etc/uci-defaults/99-luci-zh-cn
          fi

      - name: Cache source archives
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-dl-24.10.6-${{ hashFiles('packages.txt') }}
          restore-keys: |
            openwrt-dl-24.10.6-

      - name: Download source archives
        working-directory: openwrt
        run: make download -j4

      - name: Compile firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          if ! make -j2 2>&1 | tee ../build.log; then
            echo "Parallel build failed; retrying verbose single-thread build"
            make -j1 V=s 2>&1 | tee -a ../build.log
          fi

      - name: Check official runtime opkg feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(build_dir/target-*/root-*/etc/opkg/distfeeds.conf)
          (( ${#candidates[@]} > 0 )) || { echo "No generated opkg distfeeds.conf found"; exit 1; }
          conf="${candidates[0]}"
          grep -Eq '^src/gz[[:space:]]' "$conf" || { echo "Empty opkg feeds"; exit 1; }
          if grep -E '^src/gz[[:space:]]' "$conf" | grep -Ev '^src/gz[[:space:]]+[^[:space:]]+[[:space:]]+https://downloads\.openwrt\.org/' ; then
            echo "Non-official or non-HTTPS runtime feed found"; exit 1
          fi
          grep -q '/releases/24.10.6/' "$conf" || { echo "Runtime feeds version mismatch"; exit 1; }
          cp "$conf" ../distfeeds.conf.verified
          echo "Runtime opkg feeds point exclusively to official OpenWrt HTTPS release repositories"

      - name: Collect and verify output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          shopt -s nullglob
          images=(openwrt/bin/targets/mediatek/filogic/*cudy_tr3000-v1-ubootmod*sysupgrade.itb)
          (( ${#images[@]} > 0 )) || { echo "Missing expected U-Boot Mod sysupgrade.itb"; exit 1; }
          cp "${images[@]}" output/
          cp effective.config output/
          cp requested-packages.txt output/
          cp distfeeds.conf.verified output/
          cp openwrt/feeds.conf.default output/build-feeds.conf
          img_size=$(stat -c%s "${images[0]}")
          printf 'Firmware bytes: %s\nFirmware MiB: %s\n' "$img_size" "$(awk -v b="$img_size" 'BEGIN {printf "%.2f", b/1048576}')" > output/IMAGE-SIZE.txt
          if (( img_size > 64 * 1024 * 1024 )); then
            echo "::warning::Image exceeds 64 MiB; inspect partition capacity before flashing"
          fi
          printf 'OpenWrt tag: %s\nDevice: %s\nSource commit: %s\n' "$OPENWRT_REF" "$DEVICE" "$(git -C openwrt rev-parse HEAD)" > output/BUILDINFO.txt
          (cd output && sha256sum *sysupgrade.itb > SHA256SUMS)

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: tr3000-ubootmod-${{ github.run_number }}
          path: output/
          retention-days: 30

      - name: Publish Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="tr3000-ubootmod-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" output/* --title "TR3000 U-Boot Mod build #${GITHUB_RUN_NUMBER}" --notes "For TR3000 V1 128MB with OpenWrt U-Boot layout ONLY. Not for stock layout."
